<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港地生存性格測試 | MBTI 完整版 🌙</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #E67E22 0%, #c0392b 100%);
            min-height: 100vh; display: flex; flex-direction: column;
        }
        
        /* Header */
        .quiz-header { display: flex; align-items: center; padding: 16px; gap: 16px; }
        .back-button {
            background: rgba(255, 255, 255, 0.9); border: none; width: 40px; height: 40px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .progress-bar { flex: 1; height: 8px; background: rgba(255, 255, 255, 0.3); border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background: white; border-radius: 4px; transition: width 0.3s; }
        .header-placeholder { width: 40px; }
        .question-counter { color: white; font-size: 14px; font-weight: 600; }
        
        /* Content */
        .quiz-content { flex: 1; padding: 16px 20px; display: flex; flex-direction: column; gap: 16px; }
        .quiz-question { font-size: 26px; font-weight: 700; color: white; text-align: center; text-shadow: 0 2px 4px rgba(0,0,0,0.2); line-height: 1.4; }
        
        /* Grid Options */
        .options-box { display: flex; gap: 15px; width: 100%; }
        .options-row { flex-direction: row; }
        .options-col { flex-direction: column; }
        .option-card {
            flex: 1; padding: 30px 20px; border: 4px solid rgba(255,255,255,0.3);
            border-radius: 25px; cursor: pointer; transition: 0.2s;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px;
            background: rgba(255,255,255,0.1); text-align: center;
        }
        .option-card:hover { border-color: white; background: rgba(255,255,255,0.2); transform: translateY(-5px); }
        .option-card.selected { border-color: white; background: white; }
        .card-emoji { font-size: 60px; }
        .card-text { font-size: 18px; font-weight: 800; color: white; }
        .option-card.selected .card-text { color: #2c3e50; }
        
        /* Slider */
        .slider-section { padding: 8px 16px 0; }
        .slider-track-container { position: relative; height: 60px; display: flex; flex-direction: column; justify-content: center; cursor: pointer; padding: 0 40px; }
        .slider-track { width: 100%; height: 12px; background: rgba(255, 255, 255, 0.3); border-radius: 6px; position: relative; overflow: hidden; }
        .slider-track-fill { height: 100%; background: linear-gradient(90deg, #fff 0%, rgba(255,255,255,0.8) 100%); border-radius: 6px; width: 0%; transition: width 0.1s; }
        .slider-labels { display: flex; justify-content: space-between; margin-top: 12px; padding: 0 4px; }
        .slider-label { font-size: 14px; color: rgba(255, 255, 255, 0.6); font-weight: 600; }
        .slider-label.active { color: white; transform: scale(1.2); }
        .slider-thumb {
            position: absolute; top: 50%; transform: translateY(-50%); width: 80px; height: 48px;
            background: white; border-radius: 12px; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3); cursor: grab; user-select: none; left: 0;
        }
        .slider-thumb.dragging { cursor: grabbing; transform: translateY(-50%) scale(1.1); }
        .slider-thumb-text { font-size: 16px; font-weight: 700; color: #E67E22; }
        .slider-hint { text-align: center; color: rgba(255, 255, 255, 0.8); font-size: 14px; margin-top: 2px; }
        
        /* Selected Display for Slider */
        .selected-display { 
            background: white; border-radius: 20px; padding: 24px; text-align: center; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.2); margin-bottom: 20px;
        }
        .selected-emoji { font-size: 48px; line-height: 1; margin-bottom: 8px; }
        .selected-text { font-size: 20px; font-weight: 700; color: #2c3e50; }
        
        /* Footer */
        .quiz-footer { padding: 24px 20px 40px; }
        .quiz-submit-btn { 
            width: 100%; padding: 18px 24px; background: #E67E22; color: white; 
            border: none; border-radius: 14px; font-size: 20px; font-weight: 700; 
            cursor: pointer; box-shadow: 0 4px 16px rgba(230, 126, 34, 0.4);
        }
        .quiz-submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* Cover Page */
        #cover-page { 
            min-height: 100vh; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; padding: 40px 30px;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            background-size: 400% 400%; animation: grad 15s ease infinite;
        }
        @keyframes grad { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
        .cover-container {
            background: rgba(255,255,255,0.95); border-radius: 40px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.5);
            max-width: 550px; width: 100%; padding: 40px 30px; text-align: center;
        }
        .cover-emoji { font-size: 80px; margin-bottom: 20px; animation: bounce 2s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        .cover-title { font-size: 36px; font-weight: 900; color: #333; margin-bottom: 10px; }
        .cover-subtitle { font-size: 16px; color: #666; margin-bottom: 20px; }
        .version-tag { font-size: 14px; color: #999; margin-bottom: 20px; background: #f0f0f0; padding: 8px 16px; border-radius: 20px; display: inline-block; }
        .start-btn {
            background: linear-gradient(135deg, #8A2BE2, #FF69B4); color: white; border: none;
            padding: 20px 50px; border-radius: 100px; font-size: 22px; font-weight: 900;
            cursor: pointer; box-shadow: 0 10px 30px rgba(138, 43, 226, 0.4);
        }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <!-- Cover Page -->
    <div id="cover-page">
        <div class="cover-container">
            <div class="cover-emoji">🌙✨</div>
            <h1 class="cover-title">香港地生存性格測試</h1>
            <p class="cover-subtitle">搵出你潛藏喺骨子裡嘅「奇怪職業」！</p>
            <div class="version-tag">🌙 v2.1.0 完整版</div>
            <button class="start-btn" onclick="startQuiz()">開始冒險 🚀</button>
        </div>
    </div>

    <!-- Quiz UI -->
    <div id="quiz-ui" class="hidden">
        <div class="quiz-header">
            <button class="back-button" onclick="prevQuestion()">←</button>
            <div class="progress-bar"><div class="progress-fill" id="progressBar"></div></div>
            <div class="question-counter" id="questionNum">1/9</div>
        </div>

        <div class="quiz-content" id="quizContent">
            <h1 class="quiz-question" id="questionText">加載中...</h1>
            <div id="optionsArea"></div>
        </div>

        <div class="quiz-footer">
            <button class="quiz-submit-btn" id="nextBtn" onclick="nextQuestion()" disabled>下一題 →</button>
        </div>
    </div>

    <script>
        // 9條完整題目（舊版 + 新設計）
        const questions = [
            {
                id: 1, type: 'slider', dim: 'EI', progress: 11,
                q: "收工之後，你通常會點樣「充電」？",
                options: [
                    { emoji: '📚', text: '靜靜睇書', desc: '享受一個人嘅寧靜時光' },
                    { emoji: '🏃', text: '做運動', desc: '用汗水釋放壓力' },
                    { emoji: '👥', text: '同朋友聚會', desc: '同好姊妹/好兄弟傾偈' },
                    { emoji: '🎮', text: '打機追劇', desc: '沉浸喺自己嘅世界' }
                ]
            },
            {
                id: 2, type: 'grid', layout: 'col', dim: 'SN', progress: 22,
                q: "喺地鐵見到唔熟嘅同事，你會：",
                A: { emoji: '🗣️', text: '「喂！咁橋呀！」\n(然後搵話題)' },
                B: { emoji: '🎧', text: '戴返好耳機\n扮睇唔到' }
            },
            {
                id: 3, type: 'slider', dim: 'TF', progress: 33,
                q: "朋友俾人呃咗錢，你第一時間：",
                options: [
                    { emoji: '🧩', text: '笑佢笨', desc: '分析點解被呃' },
                    { emoji: '⚖️', text: '理性分析', desc: '研究邊度出錯' },
                    { emoji: '🤗', text: '安慰佢', desc: '一齊鬧個騙子' },
                    { emoji: '❤️', text: '情感支持', desc: '陪佢度過難關' }
                ]
            },
            {
                id: 4, type: 'grid', layout: 'row', dim: 'PJ', progress: 44,
                q: "你去旅行嘅行程通常係：",
                A: { emoji: '📊', text: 'Excel 表\n跟到足' },
                B: { emoji: '🌊', text: '去到機場\n先諗去邊' }
            },
            {
                id: 5, type: 'grid', layout: 'col', dim: 'TRAP', progress: 55,
                q: "老實講，你係咪亂撳緊？",
                A: { emoji: '🔥', text: '我係認真嘅！' },
                B: { emoji: '🤪', text: '你吹我唔脹' }
            },
            {
                id: 6, type: 'slider', dim: 'EI', progress: 66,
                q: "喺一個 50 人嘅 Party 入面：",
                options: [
                    { emoji: '🧘', text: '匿喺角落', desc: '享受一個人嘅寧靜' },
                    { emoji: '👥', text: '同幾個朋友', desc: '小圈子傾偈最舒服' },
                    { emoji: '🎉', text: '融入派對', desc: '隨遇而安，開心就好' },
                    { emoji: '🎤', text: '做全場焦點', desc: '帶動氣氛，成為主角' }
                ]
            },
            {
                id: 7, type: 'grid', layout: 'row', dim: 'SN', progress: 77,
                q: "你比較欣賞邊種人？",
                A: { emoji: '🧱', text: '踏實、\n注重數據' },
                B: { emoji: '🔮', text: '有遠見、\n天馬行空' }
            },
            {
                id: 8, type: 'grid', layout: 'col', dim: 'TF', progress: 88,
                q: "做決定時，你優先考慮：",
                A: { emoji: '🧠', text: '效率同埋\n邏輯' },
                B: { emoji: '🤝', text: '大家嘅\n面子同感受' }
            },
            {
                id: 9, type: 'slider', dim: 'PJ', progress: 99,
                q: "你嘅房間整潔程度係：",
                options: [
                    { emoji: '🌪️', text: '好似被炸彈炸過', desc: '尋嘢都要花半個鐘' },
                    { emoji: '📦', text: '亂中有序', desc: '自己知自己嘢擺喺邊' },
                    { emoji: '✨', text: '乾淨企理', desc: '每樣嘢都有佢嘅位置' },
                    { emoji: '🏆', text: '五星級酒店咁乾淨', desc: '連塵都冇一粒' }
                ]
            }
        ];

        let currentIdx = 0;
        let scores = { E:0, I:0, S:0, N:0, T:0, F:0, P:0, J:0 };
        let answers = [];

        function startQuiz() {
            document.getElementById('cover-page').classList.add('hidden');
            document.getElementById('quiz-ui').classList.remove('hidden');
            showQuestion();
        }

        function showQuestion() {
            const q = questions[currentIdx];
            document.getElementById('progressBar').style.width = q.progress + '%';
            document.getElementById('questionNum').textContent = (currentIdx + 1) + '/9';
            document.getElementById('questionText').textContent = q.q;
            
            const container = document.getElementById('optionsArea');
            container.innerHTML = '';
            
            if (q.type === 'slider') {
                renderSlider(q, container);
            } else {
                renderGrid(q, container);
            }
            
            updateNextButton();
        }

        function renderSlider(q, container) {
            const display = document.createElement('div');
            display.className = 'selected-display';
            display.innerHTML = `
                <div class="selected-emoji" id="selEmoji">${q.options[0].emoji}</div>
                <div class="selected-text" id="selText">${q.options[0].text}</div>
            `;
            container.appendChild(display);
            
            const sliderSection = document.createElement('div');
            sliderSection.className = 'slider-section';
            sliderSection.innerHTML = `
                <div class="slider-track-container" id="trackContainer">
                    <div class="slider-track">
                        <div class="slider-track-fill" id="trackFill" style="width:0%"></div>
                    </div>
                    <div class="slider-labels">
                        <span class="slider-label active">I</span>
                        <span class="slider-label">II</span>
                        <span class="slider-label">III</span>
                        <span class="slider-label">IV</span>
                    </div>
                    <div class="slider-thumb" id="sliderThumb" style="left:0">
                        <span class="slider-thumb-text">郁我</span>
                    </div>
                </div>
                <p class="slider-hint">👆 拖動控制器選擇</p>
            `;
            container.appendChild(sliderSection);
            
            // Slider logic
            let sliderValue = 0;
            let isDragging = false;
            const thumb = document.getElementById('sliderThumb');
            const trackContainer = document.getElementById('trackContainer');
            const trackFill = document.getElementById('trackFill');
            
            function updateSliderUI() {
                const index = Math.min(Math.floor((sliderValue / 100) * 4), 3);
                document.getElementById('selEmoji').textContent = q.options[index].emoji;
                document.getElementById('selText').textContent = q.options[index].text;
                thumb.style.left = `calc(${sliderValue}% - ${sliderValue * 0.8}px)`;
                trackFill.style.width = sliderValue + '%';
                
                document.querySelectorAll('.slider-label').forEach((label, i) => {
                    label.classList.toggle('active', i === index);
                });
                
                answers[currentIdx] = { value: sliderValue, index: index };
                updateNextButton();
            }
            
            function updateFromPosition(clientX) {
                const rect = trackContainer.getBoundingClientRect();
                const availableWidth = rect.width - 80;
                const relativeX = clientX - rect.left - 40;
                sliderValue = Math.max(0, Math.min(100, (relativeX / availableWidth) * 100));
                updateSliderUI();
            }
            
            thumb.addEventListener('touchstart', (e) => { isDragging = true; e.preventDefault(); });
            thumb.addEventListener('mousedown', () => isDragging = true);
            document.addEventListener('touchmove', (e) => { 
                if (isDragging) { e.preventDefault(); updateFromPosition(e.touches[0].clientX); }
            }, { passive: false });
            document.addEventListener('mousemove', (e) => { if (isDragging) updateFromPosition(e.clientX); });
            document.addEventListener('touchend', () => isDragging = false);
            document.addEventListener('mouseup', () => isDragging = false);
            trackContainer.addEventListener('click', (e) => updateFromPosition(e.clientX));
        }

        function renderGrid(q, container) {
            const box = document.createElement('div');
            box.className = 'options-box ' + (q.layout === 'row' ? 'options-row' : 'options-col');
            
            ['A', 'B'].forEach((type, idx) => {
                const card = document.createElement('div');
                card.className = 'option-card';
                card.innerHTML = `
                    <div class="card-emoji">${q[type].emoji}</div>
                    <div class="card-text">${q[type].text.replace(/\n/g, '<br>')}</div>
                `;
                card.onclick = () => {
                    document.querySelectorAll('.option-card').forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');
                    answers[currentIdx] = { choice: type };
                    updateNextButton();
                };
                box.appendChild(card);
            });
            
            container.appendChild(box);
        }

        function updateNextButton() {
            const btn = document.getElementById('nextBtn');
            btn.disabled = !answers[currentIdx];
            btn.textContent = currentIdx === 8 ? '睇結果！🎯' : '下一題 →';
        }

        function nextQuestion() {
            // Calculate scores
            const q = questions[currentIdx];
            const ans = answers[currentIdx];
            
            if (q.dim !== 'TRAP') {
                if (q.type === 'grid') {
                    scores[ans.choice === 'A' ? q.dim[0] : q.dim[1]] += 10;
                } else {
                    // Slider
                    const val = ans.value;
                    if (val < 50) scores[q.dim[0]] += (50 - val) / 5;
                    else scores[q.dim[1]] += (val - 50) / 5;
                }
            }
            
            currentIdx++;
            if (currentIdx < questions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }

        function prevQuestion() {
            if (currentIdx > 0) {
                currentIdx--;
                showQuestion();
            }
        }

        function showResult() {
            const final = {
                EI: Math.round((scores.E / (scores.E + scores.I || 1)) * 100),
                SN: Math.round((scores.S / (scores.S + scores.N || 1)) * 100),
                TF: Math.round((scores.T / (scores.T + scores.F || 1)) * 100),
                PJ: Math.round((scores.P / (scores.P + scores.J || 1)) * 100)
            };
            const type = (final.EI >= 50 ? 'E' : 'I') + 
                        (final.SN >= 50 ? 'S' : 'N') + 
                        (final.TF >= 50 ? 'T' : 'F') + 
                        (final.PJ >= 50 ? 'P' : 'J');
            
            localStorage.setItem('luna_mbti_result', JSON.stringify({ type, scores: final }));
            window.location.href = 'result.html';
        }
    </script>
</body>
</html>
